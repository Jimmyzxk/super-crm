services:
  postgres:
    image: postgres:17
    container_name: crm-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_HOST_PORT:-127.0.0.1:54329}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-salescrm}
      POSTGRES_USER: ${POSTGRES_USER:-salescrm_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-salescrm_migration}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-salescrm_admin} -d ${POSTGRES_DB:-salescrm}"]
      interval: 2s
      timeout: 3s
      retries: 10
    volumes:
      - salescrm_pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 256M

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: crm-web-dev
    restart: unless-stopped
    ports:
      - "${APP_HOST_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Live volume mount: Any code changes on your host Mac are instantly reflected in Docker
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
      PORT: 3000
      NODE_OPTIONS: "--max-old-space-size=640"
      DATABASE_URL: postgres://salescrm:${APP_DATABASE_PASSWORD:-salescrm_dev}@postgres:5432/${POSTGRES_DB:-salescrm}
      MIGRATION_DATABASE_URL: postgres://${POSTGRES_USER:-salescrm_admin}:${POSTGRES_PASSWORD:-salescrm_migration}@postgres:5432/${POSTGRES_DB:-salescrm}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:-salescrm_dev}
      SESSION_SECRET: ${SESSION_SECRET:-salescrm-dev-session-secret-key-at-least-32-chars}
      CRON_SECRET: ${CRON_SECRET:-salescrm-cron-secure-secret-token-key}
      DEV_ADMIN_EMAIL: ${DEV_ADMIN_EMAIL:-admin@example.com}
      DEV_ADMIN_PASSWORD: ${DEV_ADMIN_PASSWORD:-password123}
      SEED_DEMO: ${SEED_DEMO:-true}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      AI_GATEWAY_ALLOW_HOSTS: ${AI_GATEWAY_ALLOW_HOSTS:-}
    healthcheck:
      # 用 node 自身发请求，而非 wget/curl：本镜像基于 node:22-bookworm-slim，
      # 该基础镜像不含 wget/curl（官方 Dockerfile 安装后会 purge 掉），用它做探针
      # 会导致容器永远不 healthy，进而阻塞 depends_on 的下游服务。
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          # 容器内存上限之和不要逼近 Docker VM 的总上限：打满后 VM 会持续换页，
          # 表现为 CPU 飙高（而非 OOM），排查时容易误判为 CPU 问题。
          # 这里给 app 768M，与 postgres 256M 及 Docker 自身留出余量。
          # 如需更大，请先上调 Docker Desktop 的 Memory 上限再改此值。
          memory: 768M

  cron:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: crm-cron-dev
    restart: unless-stopped
    command: ["node", "--no-warnings", "--experimental-strip-types", "scripts/cron-scheduler.ts"]
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      CRON_BASE_URL: http://app:3000
      CRON_SECRET: ${CRON_SECRET:-salescrm-cron-secure-secret-token-key}
      CRON_INTERVAL_MINUTES: ${CRON_INTERVAL_MINUTES:-5}
      CRON_HEARTBEAT_FILE: /tmp/cron-last-success
    healthcheck:
      # 判据是「任务是否真的跑通」，而非「进程是否存在」。
      test: ["CMD", "node", "--no-warnings", "--experimental-strip-types", "scripts/cron-healthcheck.ts"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 96M

volumes:
  salescrm_pgdata:
